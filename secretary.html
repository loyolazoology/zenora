<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cultural Secretary | ZENORA 26</title>
<meta name="description" content="ZENORA 26, the intercollegiate zoology department festival at Loyola College, Chennai. Where every species has a place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/zenora.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section class="section wrap">
  <h1 class="page-title">Cultural Secretary</h1>
  <p class="page-sub" id="sub">Your college's registrations, read-only.</p>
  <div id="msg" class="hidden" role="alert"></div>
  <div id="content" class="hidden">
    <div class="card" id="status" style="margin-bottom:24px"></div>
    <div class="card" style="margin-bottom:24px">
      <h2 class="h2" style="font-size:1.6rem;margin-bottom:6px">Participants</h2>
      <p class="page-sub" style="margin-bottom:12px">If a change is needed, ask the participant to cancel their registration and register again. You cannot edit from here.</p>
      <p style="margin-bottom:12px"><button class="btn btn-outline btn-sm" id="csv">Download list (CSV)</button></p>
      <div class="table-wrap"><table id="people"></table></div>
    </div>
    <div class="card">
      <h2 class="h2" style="font-size:1.6rem;margin-bottom:12px">Teams</h2>
      <div class="table-wrap"><table id="teams"></table></div>
    </div>
  </div>
</section>

</main>
<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>

(async function () {
  if (!Z.requireLogin()) return;
  const $ = (id) => document.getElementById(id), msg = $("msg");
  let data;
  function paint() {
    $("sub").textContent = data.college.name + ". Read-only list of your college's registrations.";
    const dl = data.deadline ? Z.fmtDate(data.deadline) : "not set yet";
    $("status").innerHTML = data.finalized
      ? `<div class="alert alert-ok" style="margin:0"><strong>Finalized</strong> on ${Z.esc(Z.fmtDate((data.finalized_at || "").slice(0, 10)))}. Registration for ${Z.esc(data.college.name)} is closed. Contact the organisers if something must change.</div>`
      : `<p>Finalization deadline: <strong>${Z.esc(dl)}</strong>. When the list is final, press the button. This approves your college's students and <strong>closes registration for your college</strong>.</p>
         ${data.closed ? '<div class="alert alert-warn">Registration for your college is already closed by the deadline.</div>' : ""}
         <p style="margin-top:12px"><button class="btn btn-forest btn-lg" id="fin">Finalize and Approve</button></p>`;
    const f = $("fin"); if (f) f.onclick = finalize;
    $("people").innerHTML = "<thead><tr><th>ID</th><th>Name</th><th>Level</th><th>Phone</th><th>Events</th></tr></thead><tbody>" +
      (data.participants.length ? data.participants.map((p) => `<tr><td>${Z.esc(p.user_id)}</td><td>${Z.esc(p.name)}</td><td>${Z.esc(p.level)}${p.year ? " " + Z.esc(p.year) : ""}</td><td>${Z.esc(p.phone)}</td><td>${p.events.length ? p.events.map((e) => Z.esc(e.name) + (e.team ? " (team)" : "")).join(", ") : "<em>none yet</em>"}</td></tr>`).join("") : '<tr><td colspan="5">No participants yet.</td></tr>') + "</tbody>";
    $("teams").innerHTML = "<thead><tr><th>Event</th><th>Members</th><th>Size</th></tr></thead><tbody>" +
      (data.teams.length ? data.teams.map((t) => `<tr><td>${Z.esc(t.event)}</td><td>${t.members.map(Z.esc).join(", ")}</td><td>${t.size} (needs ${t.min_team} to ${t.max_team})${t.incomplete ? ' <strong style="color:var(--danger)">incomplete</strong>' : ""}</td></tr>`).join("") : '<tr><td colspan="3">No teams yet.</td></tr>') + "</tbody>";
  }
  async function finalize() {
    const incomplete = data.teams.filter((t) => t.incomplete).length;
    const warn = incomplete ? `\n\n${incomplete} team(s) are below the minimum size.` : "";
    if (!confirm("Finalize and approve your college's registrations? Registration for your college will close and you cannot undo this." + warn)) return;
    try { data = await Z.api("secretaryFinalize", {}, true); paint(); Z.show(msg, "ok", "Finalized. Thank you."); }
    catch (e) { Z.show(msg, "err", e.message); }
  }
  $("csv").onclick = () => {
    const q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
    const lines = [["ID", "Name", "Level", "Year", "Phone", "Email", "Events"].map(q).join(",")].concat(
      data.participants.map((p) => [p.user_id, p.name, p.level, p.year, p.phone, p.email, p.events.map((e) => e.name).join("; ")].map(q).join(",")));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" }));
    a.download = "college-registrations.csv"; a.click();
  };
  try { data = await Z.api("secretaryOverview", {}, true); $("content").classList.remove("hidden"); paint(); }
  catch (e) {
    if (e.code === "AUTH") return location.replace("login.html?next=secretary.html");
    Z.show(msg, "err", e.code === "FORBIDDEN" ? "This page is only for approved Cultural Secretaries. If you asked for the role while registering, the organisers will approve it soon." : e.message);
  }
})();

</script>
</body>
</html>
